# 发布流水线（技术方案 §17，极简版）：push → 构建推 GHCR → 自动同步部署文件到服务器 →
# 自动初始化 .env（首次）→ 拉起 → 健康检查（失败自动回滚）→ 自动注册 Telegram webhook。
# 服务器无需任何预置（部署目录 ~/mercury 自动创建）。
# 回滚：workflow_dispatch 填历史 sha-* tag。
#
# SSH 凭据当前放在 Repository Variables（测试期从简）；
# ⚠️ 上生产前务必迁移到 Secrets 并更换私钥——Variables 对所有仓库读者明文可见。
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 镜像 tag（留空 = 构建当前 commit；回滚填历史 sha-*）
        default: ""

env:
  REGISTRY: ghcr.io
  DOMAIN: mercury.asksquirrel.ai
  TRAEFIK_NETWORK: matrix-network
  TRAEFIK_CERTRESOLVER: cloudflare

jobs:
  # 质量门禁（复用 ci.yml）：与 build 并行抢时间；deploy 同时依赖两者——
  # 测试不过照样部署不了，只是测试挂掉时白构建一次镜像（免费额度，换 ~1.5 分钟墙钟）。
  ci:
    if: github.event_name == 'push' || inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # ---- web：在 runner 上构建 Next 产物（.next/cache 增量缓存跨次复用），镜像仅拷贝 ----
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Next 增量缓存
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextcache-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nextcache-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - name: 组装 web 运行时上下文（standalone 布局与 Dockerfile.web 一致）
        run: |
          rm -rf .web-runtime
          mkdir -p .web-runtime/.next/static
          # -a 保留符号链接：pnpm 的 node_modules 是 .pnpm 符号链接森林，解引用会破坏解析
          cp -a apps/web/.next/standalone/. .web-runtime/
          cp -a apps/web/.next/static/. .web-runtime/.next/static/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app image (api/worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-app:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push web image（预构建产物直拷贝，秒级）
        uses: docker/build-push-action@v6
        with:
          context: ./.web-runtime
          file: deploy/Dockerfile.web-prebuilt
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-web:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-web:latest

  deploy:
    needs: [ci, build]
    if: always() && ((needs.ci.result == 'success' && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: 同步部署文件到服务器（~/mercury 自动创建）
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          source: deploy/compose.prod.yaml,deploy/deploy.sh
          target: mercury/
          strip_components: 1
      - name: 部署（首次自动生成 .env；健康检查失败自动回滚；自动注册 webhook）
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.tag }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,GHCR_OWNER,TAG,DOMAIN,TRAEFIK_NETWORK,TRAEFIK_CERTRESOLVER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/mercury
            bash deploy.sh "$TAG"
