# 质量门禁（技术方案 §17）：python 与 web 两个并行 job；LLM 全走 FakeLLM，无需任何真实 key。
# PR 独立触发；push main/master 时由 Deploy workflow 经 workflow_call 复用本文件——
# 测试不过不部署，且同一提交只跑一遍 CI。刻意不与 cd.yml 合并：
# 触发场景、权限（deploy 持 SSH 凭据）、失败语义都不同，合并只会堆 if 条件。
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mercury
          POSTGRES_PASSWORD: mercury
          POSTGRES_DB: mercury
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercury"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mercury:mercury@localhost:5432/mercury
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: migration 可升可降（M1 验收标准）
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
