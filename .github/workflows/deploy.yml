# 发布流水线（技术方案 §17，极简版）：push → 构建推 GHCR → 自动同步部署文件到服务器 →
# 自动初始化 .env（首次）→ 拉起 → 健康检查（失败自动回滚）→ 自动注册 Telegram webhook。
# 服务器无需任何预置（部署目录 ~/mercury 自动创建）。
# 回滚：workflow_dispatch 填历史 sha-* tag。
#
# SSH 凭据当前放在 Repository Variables（测试期从简）；
# ⚠️ 上生产前务必迁移到 Secrets 并更换私钥——Variables 对所有仓库读者明文可见。
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 镜像 tag（留空 = 构建当前 commit；回滚填历史 sha-*）
        default: ""

env:
  REGISTRY: ghcr.io
  DOMAIN: mercury.asksquirrel.ai
  TRAEFIK_NETWORK: matrix-network
  TRAEFIK_CERTRESOLVER: cloudflare

jobs:
  build:
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push app image (api/worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-app:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-web:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mercury-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: 同步部署文件到服务器（~/mercury 自动创建）
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          source: deploy/compose.prod.yaml,deploy/deploy.sh
          target: mercury/
          strip_components: 1
      - name: 部署（首次自动生成 .env；健康检查失败自动回滚；自动注册 webhook）
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.tag }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,GHCR_OWNER,TAG,DOMAIN,TRAEFIK_NETWORK,TRAEFIK_CERTRESOLVER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ~/mercury
            bash deploy.sh "$TAG"
