[project]
name = "mercury"
version = "0.1.0"
description = "Telegram AI 客服与询盘转化系统（MVP）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "langchain-text-splitters>=0.3",
    "pypdf>=5.1",
    "trafilatura>=1.12",
    "gspread>=6.1",
    "google-auth>=2.36",
    "structlog>=24.4",
    "cryptography>=44.0",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 单一根项目 + 多包映射（技术方案 §1）：目录布局与文档一致，
# 导入名为 api / worker / domain / llm / integrations / observability
[tool.hatch.build.targets.wheel]
packages = [
    "apps/api",
    "apps/worker",
    "packages/domain",
    "packages/llm",
    "packages/integrations",
    "packages/observability",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
